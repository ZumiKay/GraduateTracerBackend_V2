services:
  mongo:
    image: mongo:7.0
    container_name: graduatetracer-test-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=graduatetracer_test
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 2s
    tmpfs:
      - /data/db

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: graduatetracer-test-runner
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_ENV=TEST
      - DATABASE_URL=mongodb://mongo:27017/graduatetracer_test
      - API_BASEURL=/v0/api
      - JWT_SECRET=test_integration_jwt_secret_key_1234567890
      - ACCESS_TOKEN_COOKIE=graduate_accessT
      - REFRESH_TOKEN_COOKIE=graduate_refreshT
      - FRONTEND_URL=http://localhost:5173
      - INVITE_LINK_SECRET=test_invite_link_secret_key_12345
    command: npm run test:integration
